  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&amp;display=swap');
    .word { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  </style>
  <!-- Icon centred above the wordmark; same bubbles as the alt logo -->
  <g transform="translate(95,16)">
