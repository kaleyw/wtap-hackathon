<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-label="RBC Candor logo, alternate (for dark blue backgrounds)">
  <title>RBC Candor (alternate)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&amp;display=swap');
    .word { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Icon: two overlapping speech bubbles (mentor/team + early talent) -->
  <g transform="translate(24,22)">
    <!-- large bubble (mentor/team): white -->
    <rect x="0" y="0" width="96" height="78" rx="24" fill="#FFFFFF"/>
    <path d="M20 74 L12 100 L42 76 Z" fill="#FFFFFF"/>
    <path d="M22 30 H66" stroke="#1B3F8F" stroke-width="7" stroke-linecap="round"/>
    <path d="M22 48 H46" stroke="#1B3F8F" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
    <!-- small bubble (early talent): yellow, with blue outline to separate from the white bubble -->
    <rect x="58" y="44" width="72" height="58" rx="20" fill="#F4C542" stroke="#1B3F8F" stroke-width="5"/>
    <path d="M112 100 L124 120 L98 102 Z" fill="#F4C542"/>
    <circle cx="80" cy="73" r="5" fill="#1B3F8F"/>
    <circle cx="94" cy="73" r="5" fill="#1B3F8F"/>
    <circle cx="108" cy="73" r="5" fill="#1B3F8F"/>
  </g>

  <!-- Wordmark -->
  <text class="word" x="182" y="68" font-size="20" font-weight="600" letter-spacing="9" fill="#F4C542">RBC</text>
  <text class="word" x="178" y="128" font-size="66" font-weight="800" letter-spacing="-2" fill="#FFFFFF">candor<tspan fill="#F4C542">.</tspan></text>
</svg>
